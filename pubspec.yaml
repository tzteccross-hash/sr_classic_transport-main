name: sr_classic_transport
description: A new Flutter application.

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  carousel_slider: ^4.2.0
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.5.0
  provider: ^6.1.0
  share_plus: ^11.0.0
  url_launcher: ^6.3.2
  http: ^1.4.0
  panara_dialogs: ^0.1.5

  get: ^4.7.2
  salomon_bottom_bar: ^3.3.2
  google_fonts: ^6.2.1
  colorful_iconify_flutter: ^0.0.5
  iconify_flutter: ^0.0.7
  flutter_rating_stars: ^1.1.0
  glassmorphism_ui: ^0.3.0
  fluttertoast: ^8.2.12
  country_picker: ^2.0.27
  translator: ^1.0.3+1
  delightful_toast: ^1.1.0
  flutter_html: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  carousel_slider: ^4.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/


flutter_launcher_icons:
  android: true
  ios: true
  linux: true
  macos:
    generate: true
  web:
    generate: true
  windows:
    generate: true
  image_path: assets/images/app_icon.png
